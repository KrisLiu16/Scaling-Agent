[project]
name = "scaling-agent"
version = "0.1.0"
description = "Self-organized multi-agent harness: N equal workers cooperating through a shared workspace, messages, and a shared context board."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22",
    "httpx>=0.28",
    "jinja2>=3.1",
    "mcp>=2.2,<3",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyyaml>=6.0",
    "typer>=0.27",
    "uvicorn>=0.53",
]

[project.optional-dependencies]
# The worker runtime runs inside each sandbox and drives the underlying single-agent harness.
worker = ["claude-agent-sdk>=0.2.159"]
# Control-plane side: provisioning Tencent Cloud AGS sandboxes and talking to envd.
ags = ["tencentcloud-sdk-python-ags>=3.1.178", "e2b>=2.51"]
# Kubernetes provider: plain pods standing in for AGS sandboxes (local clusters, CI).
k8s = ["kubernetes>=36"]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4"]

[project.scripts]
scaling-agent = "scaling_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaling_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
