# pi harness against an OpenAI-compatible endpoint (see docs/DESIGN.md 6.3). Secrets come from the
# launcher's environment: export OPENAI_API_KEY (forwarded to the workers by forward_env).
name: pi-demo
task_file: examples/tasks/example_task.md
workers: 4
duration_s: 2400
founders: 1
founding_s: 300
stagger:
  - {interval_s: 60}
max_queue_per_worker: 1.0

coord_url: http://127.0.0.1:8700                 # launcher -> coordination server
coord_public_url: https://coord.example.com      # sandboxes -> coordination server
harness: pi
model: gpt-5.6-luna
harness_options:
  base_url: http://gateway.example.com/v1        # OpenAI-compatible root, including /v1
  api: openai-responses                          # or openai-completions
  api_key_env: OPENAI_API_KEY
  thinking: medium
  # context_window: 272000                       # the model's real input window
  # max_retries: 8                               # pi's retries of overload / 5xx errors
forward_env: [OPENAI_API_KEY]

gitea:
  url: http://127.0.0.1:3000
  public_url: https://git.example.com
  owner: agents
  repo: workspace
  main_branch: main

provider:
  kind: ags
  region: ap-singapore
  tool_name: sa-worker
  image: tcr.example.com/<ns>/sa-worker@sha256:<digest>
  image_registry_type: enterprise
  role_arn: qcs::cam::uin/<uin>:roleName/<role>
  cpu: "2"
  memory: 4Gi
  disk: 20Gi
  network_mode: PUBLIC
  persistent: true
