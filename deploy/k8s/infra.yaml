# Organization infrastructure on Kubernetes: Gitea (shared workspace) + coordination server,
# plus the RBAC the launcher needs to create worker pods (the AGS stand-in).
# Secrets (sa-secrets) are created by deploy/k8s/up.sh, never committed.
apiVersion: v1
kind: Namespace
metadata:
  name: scaling-agent
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: gitea-data, namespace: scaling-agent}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gitea, namespace: scaling-agent, labels: {app: gitea}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: gitea}}
  template:
    metadata: {labels: {app: gitea}}
    spec:
      securityContext: {fsGroup: 1000}
      containers:
        - name: gitea
          image: sa-gitea:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: GITEA_ROOT_URL, value: "http://gitea:3000/"}
            - name: GITEA_ADMIN_USER
              valueFrom: {secretKeyRef: {name: sa-secrets, key: gitea-admin-user}}
            - name: GITEA_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: sa-secrets, key: gitea-admin-password}}
          ports: [{containerPort: 3000, name: http}]
          readinessProbe:
            httpGet: {path: /api/healthz, port: http}
            periodSeconds: 3
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: gitea-data}
---
apiVersion: v1
kind: Service
metadata: {name: gitea, namespace: scaling-agent}
spec:
  selector: {app: gitea}
  ports: [{port: 3000, targetPort: http, name: http}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: coord-data, namespace: scaling-agent}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: coord, namespace: scaling-agent, labels: {app: coord}}
spec:
  replicas: 1  # single writer: SQLite + one merge-queue consumer
  strategy: {type: Recreate}
  selector: {matchLabels: {app: coord}}
  template:
    metadata: {labels: {app: coord}}
    spec:
      containers:
        - name: coord
          image: sa-coord:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: SA_COORD_SELF_URL, value: "http://coord:8700"}
            - {name: SA_COORD_BOARD_MODE, value: relevant}
            - {name: SA_COORD_GITEA__URL, value: "http://gitea:3000"}
            - {name: SA_COORD_GITEA__OWNER, value: agents}
            - {name: SA_COORD_GITEA__REPO, value: workspace}
            - name: SA_COORD_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: sa-secrets, key: coord-admin-token}}
            - name: SA_COORD_GITEA__ADMIN_USER
              valueFrom: {secretKeyRef: {name: sa-secrets, key: gitea-admin-user}}
            - name: SA_COORD_GITEA__ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: sa-secrets, key: gitea-admin-password}}
          ports: [{containerPort: 8700, name: http}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: coord-data}
---
apiVersion: v1
kind: Service
metadata: {name: coord, namespace: scaling-agent}
spec:
  selector: {app: coord}
  ports: [{port: 8700, targetPort: http, name: http}]
---
# The launcher may create/delete worker pods and their per-worker secrets in this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata: {name: sa-launcher, namespace: scaling-agent}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: sa-launcher, namespace: scaling-agent}
rules:
  - apiGroups: [""]
    resources: [pods, secrets]
    verbs: [get, list, watch, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: sa-launcher, namespace: scaling-agent}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: sa-launcher}
subjects:
  - {kind: ServiceAccount, name: sa-launcher, namespace: scaling-agent}
